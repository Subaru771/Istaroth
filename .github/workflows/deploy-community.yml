name: Deploy Istaroth Community Worker

on:
  workflow_dispatch:
  push:
    branches:
      - experimental/private-hoyolab-gateway-v1
    paths:
      - 'experiments/community-cloud/src/**'
      - 'experiments/community-cloud/public/**'
      - 'experiments/community-cloud/wrangler.toml'
      - '.github/workflows/deploy-community.yml'

permissions:
  contents: read

concurrency:
  group: istaroth-community-production
  cancel-in-progress: false

jobs:
  deploy-community:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/community-cloud
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Community Worker syntax
        run: npm run check
      - name: Check Cloudflare deployment configuration
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Deployment requires CLOUDFLARE_API_TOKEN (repository secret) and CLOUDFLARE_ACCOUNT_ID (repository secret or variable)."
            exit 1
          fi
      - name: Deploy existing Istaroth Community Worker
        run: npx --yes wrangler@4.160.0 deploy
      - name: Verify Community health endpoint
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 3 https://istaroth-community.gxcccgx123.workers.dev/health
