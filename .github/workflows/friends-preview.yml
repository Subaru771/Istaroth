name: Istaroth Friends Windows preview

on:
  pull_request:
    branches: [main]
    paths:
      - app/**
      - .github/workflows/friends-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  friends-preview:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install exact dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Check Istaroth source
        working-directory: app
        run: npm run check
      - name: Test friends consent and notification rules
        working-directory: app
        run: npm run test:friends
      - name: Build offline Windows installer and portable ZIP
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win
      - name: Upload usable Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: Istaroth-Friends-Windows-EXE-and-Portable
          path: |
            app/dist/*.exe
            app/dist/*.zip
          if-no-files-found: error
          retention-days: 14
