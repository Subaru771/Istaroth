name: CodeQL static security analysis
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build_mode: none
          - language: go
            build_mode: manual
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go for Windows installer analysis
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
      - name: Trace cross-compiled Windows Go installer
        if: matrix.language == 'go'
        shell: bash
        run: |
          python scripts/build_embedded_app.py
          cd installer
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/Istaroth-CodeQL.exe main.go wizard.go
      - name: Analyze source
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
