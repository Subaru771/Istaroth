name: Gateway syntax and tests
on:
  push:
    branches:
      - fix/gateway-render-targeted-20261113
  pull_request:
    branches:
      - experimental/private-hoyolab-gateway-v1
permissions:
  contents: read
jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify gateway source syntax
        run: python -m py_compile experiments/hoyolab-gateway/gateway.py
      - name: Install Gateway dependencies and pytest
        run: python -m pip install -r experiments/hoyolab-gateway/requirements.txt pytest pytest-asyncio
      - name: Run Gateway tests
        run: python -m pytest experiments/hoyolab-gateway -q
