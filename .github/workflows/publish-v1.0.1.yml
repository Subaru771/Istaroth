name: Publish v1.0.1 offline Windows release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-verify-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Verify v1.0.1 release version and metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content app/package.json -Raw | ConvertFrom-Json
          $lock = Get-Content app/package-lock.json -Raw | ConvertFrom-Json
          if ($package.version -ne '1.0.1' -or $lock.version -ne '1.0.1') {
            throw 'Unexpected package version, or missing version lock.'
          }
          if ($lock.packages.PSObject.Properties[''].Value.version -ne $package.version) {
            throw 'Package lock root version mismatch'
          }
          if (-not (Test-Path 'docs/RELEASE_NOTES_v1.0.1.md')) {
            throw 'Release notes missing'
          }
      - name: Install locked Electron build dependencies
        shell: pwsh
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Audit high-severity advisories
        shell: pwsh
        working-directory: app
        run: npm audit --audit-level=high
      - name: Run source and behavior tests
        shell: pwsh
        working-directory: app
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { throw 'Syntax check failed' }
          npm run test:startup
          if ($LASTEXITCODE -ne 0) { throw 'Startup tests failed' }
          npm run test:v22
          if ($LASTEXITCODE -ne 0) { throw 'Resin tests failed' }
          node test_update_service.js
          if ($LASTEXITCODE -ne 0) { throw 'Updater tests failed' }
      - name: Build offline NSIS EXE and portable ZIP
        shell: pwsh
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis zip --x64 --publish never
      - name: Verify packages, rename and generate final SHA-256 checksums
        shell: pwsh
        working-directory: app
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'dist/win-unpacked/Istaroth.exe')) { throw 'Packaged executable missing' }
          if (-not (Test-Path 'dist/win-unpacked/resources/app.asar')) { throw 'Bundled application missing' }
          node -e 'const asar=require("@electron/asar");const paths=asar.listPackage("dist/win-unpacked/resources/app.asar").map(p=>p.split(String.fromCharCode(92)).join("/"));for(const file of ["main.js","preload.js","index.html","hoyolab-sync.js"]){if(!paths.some(p=>p===file||p.endsWith("/"+file)))throw new Error("Missing packaged app file: "+file)}console.log("Verified",paths.length,"packaged app files")'
          if ($LASTEXITCODE -ne 0) { throw 'App package verification failed' }
          $exe = Get-ChildItem dist -File -Filter 'Istaroth-Setup-1.0.1.exe' | Select-Object -First 1
          $zip = Get-ChildItem dist -File -Filter 'Istaroth-Setup-1.0.1.zip' | Select-Object -First 1
          if (-not $exe -or -not $zip) { throw 'Versioned Windows setup or portable ZIP missing' }
          if ((Get-AuthenticodeSignature -LiteralPath $exe.FullName).Status -ne 'NotSigned') {
            throw 'Signing status differs from advertised UNSIGNED state'
          }
          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName.Replace([char]92, [char]47) })
            if (-not ($names | Where-Object { $_ -match '(^|/)Istaroth[.]exe$' })) { throw 'Portable executable missing' }
            if (-not ($names | Where-Object { $_ -match '(^|/)resources/app[.]asar$' })) { throw 'Portable application missing' }
          } finally { $archive.Dispose() }
          Rename-Item -LiteralPath $exe.FullName -NewName 'Istaroth-v1.0.1-Setup-Windows-x64-UNSIGNED.exe'
          Rename-Item -LiteralPath $zip.FullName -NewName 'Istaroth-v1.0.1-Portable-Windows-x64-UNSIGNED.zip'
          foreach ($name in @('Istaroth-v1.0.1-Setup-Windows-x64-UNSIGNED.exe','Istaroth-v1.0.1-Portable-Windows-x64-UNSIGNED.zip')) {
            $hash = (Get-FileHash -LiteralPath "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -NoNewline -Encoding ascii -Path "dist/$name.sha256" -Value "$hash  $name`n"
            Write-Host "$name SHA256: $hash"
          }
      - name: Store verified release binaries for provenance
        uses: actions/upload-artifact@v4
        with:
          name: Istaroth-v1.0.1-offline-release-unsigned
          path: |
            app/dist/Istaroth-v1.0.1-Setup-Windows-x64-UNSIGNED.exe
            app/dist/Istaroth-v1.0.1-Setup-Windows-x64-UNSIGNED.exe.sha256
            app/dist/Istaroth-v1.0.1-Portable-Windows-x64-UNSIGNED.zip
            app/dist/Istaroth-v1.0.1-Portable-Windows-x64-UNSIGNED.zip.sha256
          retention-days: 30
          if-no-files-found: error
      - name: Publish exact verified binaries as public GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(
            'app/dist/Istaroth-v1.0.1-Setup-Windows-x64-UNSIGNED.exe',
            'app/dist/Istaroth-v1.0.1-Setup-Windows-x64-UNSIGNED.exe.sha256',
            'app/dist/Istaroth-v1.0.1-Portable-Windows-x64-UNSIGNED.zip',
            'app/dist/Istaroth-v1.0.1-Portable-Windows-x64-UNSIGNED.zip.sha256'
          )
          & gh release create v1.0.1 @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Istaroth v1.0.1 — Offline Setup & Portable' --notes-file docs/RELEASE_NOTES_v1.0.1.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
      - name: Confirm both binaries and both checksums are publicly attached
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $names = @(& gh release view v1.0.1 --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release lookup failed' }
          foreach ($needed in @(
            'Istaroth-v1.0.1-Setup-Windows-x64-UNSIGNED.exe',
            'Istaroth-v1.0.1-Setup-Windows-x64-UNSIGNED.exe.sha256',
            'Istaroth-v1.0.1-Portable-Windows-x64-UNSIGNED.zip',
            'Istaroth-v1.0.1-Portable-Windows-x64-UNSIGNED.zip.sha256'
          )) {
            if ($needed -notin $names) { throw "Published release missing $needed" }
          }
          Write-Host 'All four files published on release v1.0.1'
