name: Gateway private checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/hoyolab-gateway/**'
      - '.github/workflows/gateway-private-checks.yml'

permissions:
  contents: read

jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: experiments/hoyolab-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m compileall -q gateway.py tests
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Run mocked Gateway tests
        run: python -m pytest -q
