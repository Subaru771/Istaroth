name: Repair gateway syntax safely
on:
  push:
    branches:
      - fix/gateway-render-targeted-20261113
  pull_request:
    branches:
      - experimental/private-hoyolab-gateway-v1
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: fix/gateway-render-targeted-20261113
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repair exactly two malformed field declarations
        shell: python
        run: |
          from pathlib import Path
          p = Path('experiments/hoyolab-gateway/gateway.py')
          original = p.read_text(encoding='utf-8')
          fixes = [
            ("code: str = Field(min_length=24, max_length=24, pattern=r'^[A-Za-z0-9_-]{24} str = Field(min_length=24, max_length=24, pattern=r'^[A-Za-z0-9_-]{24}$')", "code: str = Field(min_length=24, max_length=24, pattern=r'^[A-Za-z0-9_-]{24}$')"),
            ("claim_token: str = Field(min_length=43, max_length=43, pattern=r'^[A-Za-z0-9_-]{43} str = Field(min_length=24, max_length=24, pattern=r'^[A-Za-z0-9_-]{24}$')", "claim_token: str = Field(min_length=43, max_length=43, pattern=r'^[A-Za-z0-9_-]{43}$')"),
          ]
          repaired = original
          for before, after in fixes:
              assert repaired.count(before) == 1, 'Expected exact malformed declaration once'
              repaired = repaired.replace(before, after)
          assert repaired.count('\n') == original.count('\n'), 'Unexpected line count change'
          assert len(repaired) < len(original) and len(original) < 100000, 'Unexpected file size'
          compile(repaired, str(p), 'exec')
          p.write_text(repaired, encoding='utf-8')
      - name: Verify minimal diff and commit only repaired file
        shell: bash
        run: |
          git diff --check
          git diff --stat
          git diff -- experiments/hoyolab-gateway/gateway.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/hoyolab-gateway/gateway.py
          git commit -m "fix(gateway): repair two malformed Pydantic patterns"
          git push origin HEAD:fix/gateway-render-targeted-20261113
