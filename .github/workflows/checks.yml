name: Source checks and Windows installer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build embedded app snapshot
        run: python scripts/build_embedded_app.py
      - name: Validate embedded app matches tracked source
        run: python scripts/verify_embedded_app.py
      - name: Validate JS source
        working-directory: app
        run: npm run check
      - name: Startup regression tests
        working-directory: app
        run: npm run test:startup
      - name: Resin and notification tests
        working-directory: app
        run: npm run test:v22
      - name: Read-only updater security tests
        working-directory: app
        run: node test_update_service.js
      - name: Renderer trust and cookie security regression tests
        working-directory: app
        run: npm run test:security

  build-windows-installer:
    needs: source-checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Build embedded app snapshot
        shell: pwsh
        run: python scripts/build_embedded_app.py
      - name: Compile GUI installer from embedded app snapshot
        shell: pwsh
        working-directory: installer
        run: go build -ldflags='-H=windowsgui' -o Istaroth_Setup_Built_From_Source.exe main.go wizard.go
      - name: Write SHA256
        shell: pwsh
        working-directory: installer
        run: |
          $h = (Get-FileHash -Algorithm SHA256 Istaroth_Setup_Built_From_Source.exe).Hash.ToLower()
          Set-Content -NoNewline -Encoding ascii -Path Istaroth_Setup_Built_From_Source.exe.sha256 -Value $h
      - uses: actions/upload-artifact@v4
        with:
          name: Istaroth-unsigned-windows-build
          path: |
            installer/Istaroth_Setup_Built_From_Source.exe
            installer/Istaroth_Setup_Built_From_Source.exe.sha256

  # This candidate is for QA only. It bundles Electron instead of downloading
  # the runtime during setup. It must pass real Windows install/uninstall tests
  # before it can replace the published Go-based Istaroth 1.0 installer.
  build-standard-nsis-candidate:
    needs: source-checks
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Electron and electron-builder
        working-directory: app
        shell: pwsh
        run: npm ci --no-audit --no-fund
      - name: Package full-offline Electron + NSIS candidate
        working-directory: app
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Verify build artifacts, generate SHA-256
        working-directory: app
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -File -Filter 'Istaroth-Setup-*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'NSIS installer not produced' }
          $sig = Get-AuthenticodeSignature -LiteralPath $exe.FullName
          Write-Host "Candidate signature: $($sig.Status) (unsigned expected)"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe.FullName).Hash.ToLowerInvariant()
          Set-Content -Encoding ascii -Path ($exe.FullName + '.sha256') -Value "$hash  $($exe.Name)"
          Write-Host "Candidate file: $($exe.Name)"
          Write-Host "SHA-256: $hash"
      - uses: actions/upload-artifact@v4
        with:
          name: Istaroth-standard-NSIS-candidate-UNSIGNED-NOT-RELEASE
          path: |
            app/dist/Istaroth-Setup-*.exe
            app/dist/Istaroth-Setup-*.exe.sha256
          if-no-files-found: error
