name: Source checks and offline Windows distribution candidates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify locked dependencies are present
        run: |
          node -e "const p=require('./app/package.json'),l=require('./app/package-lock.json'); if(l.version!==p.version || JSON.stringify(l.packages[''].devDependencies)!==JSON.stringify(p.devDependencies)) process.exit(1)"
      - name: Build legacy embedded app snapshot for regression coverage
        run: python scripts/build_embedded_app.py
      - name: Validate legacy snapshot still matches tracked source
        run: python scripts/verify_embedded_app.py
      - name: Validate JS source
        working-directory: app
        run: npm run check
      - name: Startup regression tests
        working-directory: app
        run: npm run test:startup
      - name: Resin and notification tests
        working-directory: app
        run: npm run test:v22
      - name: Telegram friend alerts privacy and threshold tests
        working-directory: app
        run: npm run test:friends
      - name: Validate cloud-hosted resin API, privacy, deduplication and Telegram opt-in
        run: |
          cd cloud
          npm test
      - name: Validate Istaroth Community integration
        working-directory: app
        run: npm run test:community
      - name: Validate encrypted desktop Cloudflare connection
        working-directory: app
        run: npm run test:cloud
      - name: Settings layout and wallpaper regression tests
        working-directory: app
        run: npm run test:settings
      - name: Compact window layout regression tests
        working-directory: app
        run: npm run test:layout
      - name: Personal wallpaper loading and isolation regression tests
        working-directory: app
        run: npm run test:wallpapers
      - name: Read-only updater security tests
        working-directory: app
        run: node test_update_service.js

  build-offline-windows-candidates:
    if: github.event_name == 'workflow_dispatch'
    needs: source-checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install exact reviewed Electron dependencies
        working-directory: app
        shell: pwsh
        run: npm ci --no-audit --no-fund
      - name: Audit known high-severity dependency advisories
        working-directory: app
        shell: pwsh
        run: npm audit --audit-level=high
      - name: Build complete offline NSIS installer and portable ZIP
        working-directory: app
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis zip --x64 --publish never
      - name: Validate embedded app, ZIP layout and unsigned candidates
        working-directory: app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'dist/win-unpacked/Istaroth.exe')) { throw 'The Windows GUI executable is missing' }
          if (-not (Test-Path 'dist/win-unpacked/resources/app.asar')) { throw 'Electron app archive is missing' }
          node -e 'const asar=require("@electron/asar");const paths=asar.listPackage("dist/win-unpacked/resources/app.asar").map(p=>p.split(String.fromCharCode(92)).join("/"));for(const file of ["main.js","preload.js","index.html","hoyolab-sync.js"]){if(!paths.some(p=>p===file||p.endsWith("/"+file)))throw new Error("Missing packaged app file: "+file+"; sample paths: "+paths.slice(0,12).join(","))}console.log("Verified",paths.length,"files in app.asar")'
          if ($LASTEXITCODE -ne 0) { throw 'Packaged source verification failed' }
          $exe = Get-ChildItem dist -File -Filter 'Istaroth-Setup-*.exe' | Select-Object -First 1
          $zip = Get-ChildItem dist -File -Filter 'Istaroth-Setup-*.zip' | Select-Object -First 1
          if (-not $exe -or -not $zip) { throw 'One or both Windows distribution candidates were not built' }
          $signature = Get-AuthenticodeSignature -LiteralPath $exe.FullName
          if ($signature.Status -ne 'NotSigned') { throw "Unexpected installer signing state: $($signature.Status)" }
          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName.Replace([char]92, [char]47) })
            if (-not ($names | Where-Object { $_ -match '(^|/)Istaroth[.]exe$' })) { throw 'Portable ZIP has no Istaroth.exe' }
            if (-not ($names | Where-Object { $_ -match '(^|/)resources/app[.]asar$' })) { throw 'Portable ZIP has no app.asar' }
          } finally { $archive.Dispose() }
          $version = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release candidate version' }
          $setupName = "Istaroth-v$version-Offline-Setup-Windows-x64-QA-UNSIGNED.exe"
          $portableName = "Istaroth-v$version-Portable-Windows-x64-QA-UNSIGNED.zip"
          Move-Item -LiteralPath $exe.FullName -Destination "dist/$setupName"
          Move-Item -LiteralPath $zip.FullName -Destination "dist/$portableName"
          foreach ($name in @($setupName,$portableName)) {
            $hash = (Get-FileHash -LiteralPath "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -NoNewline -Encoding ascii -Path "dist/$name.sha256" -Value "$hash  $name`n"
            Write-Host "$name SHA256: $hash"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Istaroth-Windows-Offline-Setup-and-Portable-QA-UNSIGNED
          path: |
            app/dist/Istaroth-v*-Offline-Setup-Windows-x64-QA-UNSIGNED.exe
            app/dist/Istaroth-v*-Offline-Setup-Windows-x64-QA-UNSIGNED.exe.sha256
            app/dist/Istaroth-v*-Portable-Windows-x64-QA-UNSIGNED.zip
            app/dist/Istaroth-v*-Portable-Windows-x64-QA-UNSIGNED.zip.sha256
          retention-days: 3
          if-no-files-found: error
