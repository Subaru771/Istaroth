name: Community cloud checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/community-cloud/**'
      - '.github/workflows/community-cloud-checks.yml'

permissions:
  contents: read

jobs:
  community-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/community-cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker and browser syntax
        run: npm run check
      - name: Run Community tests
        run: npm test
