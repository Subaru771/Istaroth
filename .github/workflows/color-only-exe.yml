name: Build Istaroth color-only Windows EXE

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/color-only-exe.yml
      - scripts/build-color-only-exe.ps1
      - installer/color-only.iss
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install exact dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Check application, theme UI and regressions
        working-directory: app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($test in @('check','test:startup','test:v22','test:settings','test:layout')) {
            npm run $test
            if ($LASTEXITCODE -ne 0) { throw "Test failed: $test" }
          }
          node test_update_service.js
          if ($LASTEXITCODE -ne 0) { throw 'Updater test failed' }

      - name: Create and smoke-test the offline Windows EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/build-color-only-exe.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Istaroth-v1.1.2-Color-Only-Windows-EXE
          path: |
            app/dist/Istaroth-v1.1.2-Color-Only-Setup-Windows-x64-UNSIGNED.exe
            app/dist/Istaroth-v1.1.2-Color-Only-Setup-Windows-x64-UNSIGNED.exe.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Publish direct EXE download on GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'app\dist\Istaroth-v1.1.2-Color-Only-Setup-Windows-x64-UNSIGNED.exe'
          $tag = 'v1.1.2-launch-fix'
          $notes = 'Windows x64 offline EXE: all application files and Electron included. Color-only interface with automatic closing of old Istaroth processes, corrected desktop shortcut and visible version marker. Responsive compact layout retained. Color-only Istaroth interface. Embedded Electron and actual installed app.asar were validated against the v1.1.2 source. Source tests and silent installation passed. UNSIGNED preview; existing account data are preserved. Old Istaroth.exe processes are closed during installation and the desktop shortcut is replaced.'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe "$exe.sha256" --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag $exe "$exe.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Istaroth v1.1.2 Color-only Installer Fix — Windows Preview' --notes $notes --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish Windows executable' }
