name: Build Istaroth color-only Windows EXE

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/color-only-exe.yml
      - scripts/build-color-only-exe.ps1
      - installer/color-only.iss
      - app/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install exact dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Check application, theme UI and regressions
        working-directory: app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($test in @('check','test:startup','test:v22','test:settings','test:layout','test:wallpapers','test:friends','test:cloud','test:community')) {
            npm run $test
            if ($LASTEXITCODE -ne 0) { throw "Test failed: $test" }
          }
          node test_update_service.js
          if ($LASTEXITCODE -ne 0) { throw 'Updater test failed' }

      - name: Create and smoke-test the offline Windows EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/build-color-only-exe.ps1

      - name: Label this build as the Friends preview
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $old = 'app/dist/Istaroth-v1.1.3-Wallpapers-Setup-Windows-x64-UNSIGNED.exe'
          $new = 'app/dist/Istaroth-v1.1.3-Friends-Setup-Windows-x64-UNSIGNED.exe'
          Move-Item -LiteralPath $old -Destination $new
          Remove-Item -LiteralPath "$old.sha256" -ErrorAction SilentlyContinue
          $hash = (Get-FileHash -LiteralPath $new -Algorithm SHA256).Hash.ToLowerInvariant()
          $name = Split-Path -Leaf $new
          Set-Content -NoNewline -Encoding ascii -Path "$new.sha256" -Value "$hash  $name`n"

      - uses: actions/upload-artifact@v4
        with:
          name: Istaroth-v1.1.3-Friends-Windows-EXE
          path: |
            app/dist/Istaroth-v1.1.3-Friends-Setup-Windows-x64-UNSIGNED.exe
            app/dist/Istaroth-v1.1.3-Friends-Setup-Windows-x64-UNSIGNED.exe.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Publish direct EXE download on GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'app\dist\Istaroth-v1.1.3-Friends-Setup-Windows-x64-UNSIGNED.exe'
          $tag = 'v1.1.3-friends-preview'
          $notes = 'Istaroth Windows friends preview. Opt-in Telegram resin notifications for selected friends with individual 160/180/190/200 thresholds, private invites, encrypted local bot-token storage, and unsubscribe via /stop. Istaroth must remain running on an online PC, and each sender must connect their own BotFather bot. Existing color-only region themes, separate Main/Resin/Mini user wallpapers, HoYoLAB tracking, and settings remain. Tests and installer smoke checks passed. UNSIGNED preview. Live Telegram delivery needs a real bot and consenting recipient; see docs/FRIEND_ALERTS.md.'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe "$exe.sha256" --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag $exe "$exe.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Istaroth v1.1.3 — Friends & Resin Alerts Preview' --notes $notes --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish Windows executable' }
