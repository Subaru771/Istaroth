name: Publish verified v1.0 checksum
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1-checksum.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach-checksum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check checksum against published GitHub installer digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checksum="checksums/Istaroth_Setup_v1.0.exe.sha256"
          expected="$(awk '{print $1}' "$checksum")"
          filename="$(awk '{print $2}' "$checksum")"
          test "$filename" = 'Istaroth_Setup_v1.0.exe'
          test "${#expected}" -eq 64
          published="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/1.0" --jq '.assets[] | select(.name=="Istaroth_Setup_v1.0.exe") | .digest')"
          test "sha256:$expected" = "$published"
          echo "The published EXE digest matches the tracked checksum."
      - name: Attach checksum to existing public release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload 1.0 checksums/Istaroth_Setup_v1.0.exe.sha256
      - name: Verify checksum is listed as a release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view 1.0 --json assets --jq '.assets[].name' | grep -Fx 'Istaroth_Setup_v1.0.exe.sha256'
