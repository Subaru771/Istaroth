name: Bug report
description: Report a reproducible Istaroth issue (never include HoYoLAB credentials).
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security and privacy:** Never paste HoYoLAB cookies, access tokens, passwords, session exports, private logins or unredacted debug logs into a public issue. Report security vulnerabilities privately using SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Istaroth version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the problem without private tokens, account identifiers, or cookies.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Istaroth
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all cookies, credentials, account identifiers, and session tokens from this report.
          required: true
